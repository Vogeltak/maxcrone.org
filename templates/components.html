<!-- TODO: optimize for screen DPI using srcset -->
{% component image(name: string, size=1280, caption="", loading="eager") %}
<picture>
<source srcset="https://f003.backblazeb2.com/file/maxcrone-org/img/{{ name }}_{{ size }}.avif" type="image/avif">
<source srcset="https://f003.backblazeb2.com/file/maxcrone-org/img/{{ name }}_{{ size }}.webp" type="image/webp">
<img src="https://f003.backblazeb2.com/file/maxcrone-org/img/{{ name }}_{{ size}}.jpg" alt="{{ caption }}" loading="{{ loading }}">
</picture>
{% if caption %}
<p class="picture-subscript">{{ caption }}</p>
{% endif %}
{% endcomponent image %}
